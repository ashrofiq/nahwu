name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build
        run: |
          if [ -f nahwu-quest-android-project.zip ]; then unzip -q nahwu-quest-android-project.zip; fi
          cd "$(dirname "$(find . -name settings.gradle | head -1)")"
          gradle bundleRelease assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/hasil"
          find . -path "*/build/outputs/*" \( -name "*.apk" -o -name "*.aab" \) -exec cp {} "$GITHUB_WORKSPACE/hasil/" \;
          ls -la "$GITHUB_WORKSPACE/hasil"
      - uses: actions/upload-artifact@v4
        with:
          name: NahwuQuest-release
          path: hasil/*
          if-no-files-found: error
